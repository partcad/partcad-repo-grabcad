# PartCAD package: GrabCAD Library models as parts, served by a repository plugin.
#
# Published as //pub/collection/grabcad/models: this package is
# //pub/collection/grabcad, and its one external dependency 'models' is served by
# the grabcad_repo plugin. Nothing is listed - a model site's catalog is not
# something to enumerate - so a part is asked for by name, and found with
# 'pc search parts' (see the README).
name: //pub/collection/grabcad

desc: |
  Models in the GrabCAD Library (https://grabcad.com/library) as PartCAD
  parts, a part per file of a model, by the model's slug. Nothing is listed: a
  part is asked for by name, and found with 'pc search parts'. No geometry is
  vendored; every file is fetched from GrabCAD when it is first built.
url: https://grabcad.com/library

# The first PartCAD that has the toolkit this plugin is written with
# (plugin_models), and hands a repository plugin the key it is asked for
# taken apart ('query').
partcad: ">=0.9.20"

# An upload to a model site says nothing about whether, or how, it is made to
# be manufactured. The plugin says the same of 'models' in its metadata.
manufacturable: false

docs:
  name: GrabCAD for PartCAD
  usage: |
    ```shell
    pc search parts -P //pub/collection/grabcad/models -k "nema 17"
    pc inspect //pub/collection/grabcad/models:nema-17-stepper-motor-23
    pc inspect "//pub/collection/grabcad/models:nema-17-stepper-motor-23;format=step"
    ```

dependencies:
  models:
    type: external
    plugin: :grabcad_repo
    desc: GrabCAD Library models, a part per file.

repositories:
  grabcad_repo:
    type: basic
    path: grabcad_repo.py
    desc: Serves GrabCAD Library models as parts, and searches GrabCAD.
    # Every parameter here is a default for every GrabCAD part, and yours
    # to change without touching this package, two ways:
    #
    # - in your own ~/.partcad/config.yaml, under 'parameters', by the
    #   plugin's name - which is also where 'pc login' keeps the session:
    #
    #     parameters:
    #       //pub/collection/grabcad:grabcad_repo:
    #         formats: stl,3mf
    #
    # - or in a package of your own, as an enrich of the plugin and a package
    #   it serves, whose parts are then yours to name - '//grabcad_meshes:<model>'
    #   in a package at the root (never with credentials: those are yours,
    #   not a package's):
    #
    #     repositories:
    #       meshes_repo:
    #         type: enrich
    #         source: //pub/collection/grabcad:grabcad_repo
    #         with:
    #           formats: stl,3mf
    #     dependencies:
    #       grabcad_meshes:
    #         type: external
    #         plugin: :meshes_repo
    #
    # A part's own parameters override these for that part. Every part takes
    # 'file' (one of the model's files, by name ('<name>#2' for the second of
    # that name)), 'format' (its best file of that format: one of the
    # 'formats' below) and 'source' (as below) - in its name,
    # 'nema-17-stepper-motor-23;format=stl', or in the 'with' of an enrich of
    # the part:
    #
    #     parts:
    #       clip:
    #         type: enrich
    #         source: //pub/collection/grabcad/models:nema-17-stepper-motor-23
    #         with:
    #           format: stl
    parameters:
      formats:
        type: string
        default: ""
        desc: >-
          The formats to take a model in, best first, separated by commas:
          step, brep, iges, 3mf, stl, obj, glb, usd, sldprt, ipt,
          catpart, f3d, fcstd, sat, pvz, scad. A format left out is
          not taken
          - 'stl,3mf' is meshes only - unless a part asks for it by its own
          'format' or 'file'. Empty is all of them, in that order.
      source:
        type: string
        default: auto
        enum: [auto, original, preview]
        desc: >-
          Which of a model's files. GrabCAD has no preview meshes of its own:
          every file is the designer's, and downloading one takes a signed-in
          account, so 'auto' and 'original' are the same here, and 'preview'
          finds nothing.
      # Empty here, and meant to stay so: a credential is the user's own, and
      # is set where only they see it.
      session:
        type: string
        default: ""
        desc: >-
          The '_grabcad_session' cookie of a browser signed in to GrabCAD.
          Downloading a file needs it; reading a model and searching do not.
          GrabCAD has no API keys. 'pc login
          //pub/collection/grabcad:grabcad_repo' gets it in a browser and keeps
          it in your ~/.partcad/config.yaml, under 'parameters' as above; 'pc
          login --agent' says how to get it by hand, and takes it back with '--
          set session=...'. The GRABCAD_SESSION environment variable gives it
          too, where the plugin's sandbox sees the environment (a container
          does not). Never set it in a package.
        shared: true
